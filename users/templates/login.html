<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Login</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, orangered 0%, #ff7e5f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            padding: 2.5rem 2rem;
            max-width: 350px;
            width: 100%;
            text-align: center;
        }
        .login-container h2 {
            color: orangered;
            margin-bottom: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #ff7e5f;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            transition: border-color 0.2s;
        }
        .login-container input:focus {
            border-color: orangered;
            outline: none;
        }
        .login-container button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(90deg, orangered 60%, #ff7e5f 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .login-container button:hover {
            background: linear-gradient(90deg, #ff7e5f 0%, orangered 100%);
        }
        .login-container p {
            margin-top: 1.5rem;
            font-size: 0.98rem;
        }
        .login-container a {
            color: orangered;
            text-decoration: none;
            font-weight: 600;
            transition: text-decoration 0.2s;
        }
        .login-container a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem 0.7rem;
                max-width: 95vw;
            }
            .login-container h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Job Seeker Login</h2>
        <form method="POST" action="{% url 'login_jobseeker' %}">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
           
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <p>Don’t have an account? <a href="{% url 'register_jobseeker' %}">Register here</a></p>
    </div>
</body>
</html>
