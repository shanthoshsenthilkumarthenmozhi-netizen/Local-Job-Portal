<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Registration</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, orangered 0%, #ff7e5f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.15);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 370px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: orangered;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            padding: 0.75rem 1rem;
            border: 1px solid #ff7e5f;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
            background: #fff;
        }
        input:focus {
            border-color: orangered;
            box-shadow: 0 0 0 2px #ffecd2;
        }
        button[type="submit"] {
            background: linear-gradient(90deg, orangered 60%, #ff7e5f 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        button[type="submit"]:hover {
            background: linear-gradient(90deg, #ff7e5f 0%, orangered 100%);
            transform: translateY(-2px) scale(1.03);
        }
        p {
            text-align: center;
            margin-top: 1.5rem;
            color: #444;
        }
        a {
            color: orangered;
            text-decoration: none;
            font-weight: 500;
            transition: text-decoration 0.2s;
        }
        a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.2rem 0.5rem 1.5rem 0.5rem;
                max-width: 98vw;
            }
            h2 {
                font-size: 1.3rem;
            }
            input, button {
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Job Seeker Registration</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Phone" required>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="{% url 'login_jobseeker' %}">Login here</a></p>
    </div>
</body>
</html>
