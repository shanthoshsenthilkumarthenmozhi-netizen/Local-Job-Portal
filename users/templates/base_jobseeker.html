<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobSeeker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --theme-main: orangered;
            --theme-contrast: #fff;
            --sidebar-bg: #fff3e6;
            --sidebar-link: #d84315;
            --sidebar-link-hover: orangered;
            --navbar-bg: orangered;
            --navbar-link: #fff;
            --navbar-link-hover: #ffe5d0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: var(--navbar-bg) !important;
            min-height: 70px;
            box-shadow: 0 2px 8px rgba(255, 87, 34, 0.08);
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 2rem;
            color: var(--theme-contrast) !important;
            letter-spacing: 1px;
        }
        .navbar-nav .nav-link {
            color: var(--navbar-link) !important;
            font-weight: 600;
            font-size: 1.2rem;
            margin-left: 1rem;
            transition: color 0.2s;
        }
        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active {
            color: var(--navbar-link-hover) !important;
        }
        .sidebar {
            min-height: 100vh;
            background-color: var(--sidebar-bg);
            padding: 2rem 0.5rem 2rem 0.5rem;
            border-right: 2px solid #ffd6c2;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .sidebar .position-sticky {
            position: static;
        }
        .sidebar a {
            color: var(--sidebar-link);
            display: flex;
            align-items: center;
            padding: 18px 24px;
            margin-bottom: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            transition: background 0.2s, color 0.2s;
            width: 100%;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: var(--sidebar-link-hover);
            color: var(--theme-contrast);
        }
        .sidebar a svg, .sidebar a span.emoji {
            margin-right: 12px;
            font-size: 1.4em;
        }
        .content {
            padding: 40px 30px 30px 30px;
            min-height: 100vh;
            background: #fff;
            border-radius: 18px;
            margin: 24px 0;
            box-shadow: 0 2px 16px rgba(255, 87, 34, 0.06);
        }
        @media (max-width: 991.98px) {
            .sidebar {
                min-height: auto;
                padding: 1rem 0.5rem;
            }
            .content {
                padding: 24px 10px 10px 10px;
                margin: 12px 0;
            }
        }
        @media (max-width: 767.98px) {
            .sidebar {
                flex-direction: row;
                align-items: center;
                justify-content: space-around;
                border-right: none;
                border-bottom: 2px solid #ffd6c2;
                min-height: 60px;
                padding: 0.5rem 0;
            }
            .sidebar a {
                font-size: 1rem;
                padding: 10px 8px;
                margin-bottom: 0;
                border-radius: 6px;
            }
            .content {
                padding: 12px 2px;
                margin: 8px 0;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'jobseeker_dashboard' %}">LocalTalentZ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'jobseeker_dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'apply_job' 1 %}">Apply Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout_jobseeker' %}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Layout -->
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <!-- Sidebar -->
            <nav class="col-12 col-md-3 col-lg-2 sidebar">
                <div class="position-sticky">
                    <a href="{% url 'jobseeker_dashboard' %}"><span class="emoji">🏠</span> Dashboard</a>
                    <a href="#"><span class="emoji">📄</span> My Applications</a>
                    <a href="#"><span class="emoji">👤</span> Profile</a>
                    <a href="#"><span class="emoji">⚙️</span> Settings</a>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col content">
                {% block content %}
                <!-- Page-specific content goes here -->
                {% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
