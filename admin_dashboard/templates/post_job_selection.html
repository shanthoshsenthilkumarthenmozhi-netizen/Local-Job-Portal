{% extends 'admin_panel.html' %}
{% load static %}

{% block title %} Post Job - Select Company {% endblock %}

    <!-- Custom CSS for Dashboard (re-used for consistent theme) -->
   {% block extra_head %} <link rel="stylesheet" href="{% static 'css/admin/post_job_selection.css' %}">{% endblock %}

{% block main_content %}
    <style>
        .selection-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .selection-card {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .selection-card h2 {
            margin-bottom: 2rem;
            font-weight: 600;
        }
        .selection-btn {
            display: block;
            width: 100%;
            margin: 0.5rem 0;
            padding: 0.75rem 1.5rem;
            background: orangered;
            color: #fff !important;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
        }
        .selection-btn:hover, .selection-btn:focus {
            background: #d84315;
            color: #fff;
            text-decoration: none;
        }
        .selection-btn i {
            margin-right: 0.5rem;
        }
    </style>
    <div class="selection-container">
        <div class="selection-card">
            <h2>Post a Job: Select Company Type</h2>
            <a href="{% url 'register_company' %}" class="selection-btn">
                <i class="fas fa-plus-circle"></i> New Registration
            </a>
            <a href="{% url 'company_login' %}" class="selection-btn">
                <i class="fas fa-building"></i> Already Registered Company
            </a>
        </div>
    </div>
{% endblock main_content %}
